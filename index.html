<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffefa">
  <title>Voo Encantado</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --ink: #29383a;
      --muted: #879293;
      --blue: #78bdd0;
      --blue-dark: #438ea4;
      --sun: #f1c766;
      --line: #e8eeea;
      --white: #fffefa;
      font-family: "DM Sans", sans-serif;
      color: var(--ink);
      background: var(--white);
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    } b

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse at 8% 12%, rgba(235, 246, 239, .65), transparent 32%),
        radial-gradient(ellipse at 92% 88%, rgba(255, 241, 210, .55), transparent 28%),
        var(--white);
    }

    button { font: inherit; }

    .page {
      width: min(1120px, calc(100% - 48px));
      margin: 0 auto;
      padding: 30px 0 25px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 22px;
    }

    .brand { display: flex; align-items: center; gap: 12px; }

    .brand-mark {
      display: grid;
      width: 39px;
      height: 39px;
      place-items: center;
      border: 1px solid #edf0e9;
      border-radius: 13px;
      background: #fff;
      color: #d5ad52;
      box-shadow: 0 3px 12px rgba(57, 80, 74, .05);
    }

    .brand-mark svg { width: 22px; height: 22px; }
    .eyebrow { margin: 0 0 2px; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .13em; }
    h1 { margin: 0; font-family: Fraunces, Georgia, serif; font-size: 21px; font-weight: 500; }

    .stats { display: flex; align-items: center; gap: 9px; }

    .stat {
      display: flex;
      min-width: 96px;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,.8);
    }

    .stat svg { width: 17px; height: 17px; flex: none; }
    .stat-label { display: block; color: var(--muted); font-size: 9px; line-height: 1.2; }
    .stat-value { display: block; margin-top: 1px; font-size: 14px; font-weight: 700; line-height: 1.2; }

    .game-shell {
      position: relative;
      overflow: hidden;
      border: 1px solid #e9eeea;
      border-radius: 8px;
      background: #eff9fb;
      box-shadow: 0 16px 50px rgba(71, 115, 113, .09);
    }

    canvas { display: block; width: 100%; aspect-ratio: 1000 / 560; }

    .sound-toggle {
      position: absolute;
      z-index: 2;
      top: 12px;
      right: 12px;
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border: 1px solid rgba(214, 228, 225, .9);
      border-radius: 7px;
      background: rgba(255, 255, 255, .9);
      color: #438ea4;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(57, 80, 74, .08);
    }

    .sound-toggle svg { width: 19px; height: 19px; }
    .sound-toggle:focus-visible { outline: 3px solid #e4bd60; outline-offset: 2px; }

    .journey { margin-top: 12px; }
    .journey-heading { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 6px; color: #718184; font-size: 10px; font-weight: 700; }
    .journey-track { height: 5px; overflow: hidden; border-radius: 5px; background: #e7eeeb; }
    .journey-fill { display: block; width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #79b9c3, #d9b85f); transition: width .22s ease; }

    .launch-layer {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 10px;
      padding: 24px;
      background: linear-gradient(90deg, rgba(248,253,251,.14), rgba(255,255,255,.60), rgba(248,253,251,.14));
      text-align: center;
      transition: opacity .2s ease;
    }

    .launch-layer[hidden] { display: none; }

    .launch-sparkle { width: 38px; height: 38px; color: #ddb758; }
    .arrival-castle { display: none; width: 76px; height: 68px; }
    .launch-layer.arrived .launch-sparkle { display: none; }
    .launch-layer.arrived .arrival-castle { display: block; }
    .launch-layer h2 { margin: 0; font-family: Fraunces, Georgia, serif; font-size: clamp(25px, 4vw, 37px); font-weight: 500; }
    .launch-layer p { margin: 0 0 8px; color: #647678; font-size: 14px; }

    .launch-button {
      display: inline-flex;
      min-height: 45px;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 0 19px;
      border: 0;
      border-radius: 7px;
      background: #438ea4;
      color: white;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(67, 142, 164, .2);
      transition: background .15s ease, transform .15s ease;
    }

    .launch-button:hover { transform: translateY(-1px); background: #347e93; }
    .launch-button:focus-visible, .flight-button:focus-visible { outline: 3px solid #e4bd60; outline-offset: 3px; }
    .launch-button svg { width: 15px; height: 15px; }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-top: 13px;
    }

    .hint { margin: 0; color: #778587; font-size: 12px; }
    .hint kbd { padding: 3px 7px; border: 1px solid #e5eae6; border-radius: 5px; background: #fff; color: #526366; font: 600 11px "DM Sans", sans-serif; }

    .flight-button {
      display: none;
      min-width: 108px;
      min-height: 42px;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: 1px solid #dce9e5;
      border-radius: 7px;
      background: #fff;
      color: #438ea4;
      font-size: 12px;
      font-weight: 700;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .flight-button svg { width: 17px; height: 17px; }
    .flight-button:active { background: #edf7f6; }

    .footnote { display: flex; justify-content: center; gap: 7px; margin: 20px 0 0; color: #97a19d; font-size: 11px; }
    .footnote svg { width: 14px; height: 14px; color: #d9b457; }

    @media (max-width: 620px) {
      .page { width: min(100% - 28px, 520px); padding-top: 19px; }
      .topbar { margin-bottom: 15px; }
      .brand-mark { width: 35px; height: 35px; }
      h1 { font-size: 19px; }
      .eyebrow { font-size: 9px; }
      .stats { gap: 6px; }
      .stat { min-width: 0; gap: 6px; padding: 7px 8px; }
      .stat svg { width: 15px; height: 15px; }
      .stat-label { font-size: 8px; }
      .stat-value { font-size: 12px; }
      .controls { align-items: flex-start; }
      .hint { max-width: 200px; padding-top: 3px; font-size: 11px; line-height: 1.6; }
      .flight-button { display: inline-flex; flex: none; }
      .footnote { margin-top: 15px; }
    }

    @media (max-width: 390px) {
      .page { width: calc(100% - 20px); }
      .brand { gap: 8px; }
      .stats { gap: 4px; }
      .stat { padding: 6px; }
      .stat svg { display: none; }
      .hint { max-width: 160px; }
    }

    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 2.7 14.15 9l6.5.1-5.2 3.9 1.9 6.2L12 15.5l-5.35 3.7 1.9-6.2-5.2-3.9 6.5-.1L12 2.7Z" fill="currentColor"/><path d="m18.7 2 .48 1.34 1.4.02-1.12.84.4 1.34-1.16-.8-1.15.8.4-1.34-1.13-.84 1.4-.02L18.7 2Z" fill="#8fc8cf"/></svg>
        </div>
        <div><p class="eyebrow">UM JOGO DE CÉU E MAGIA</p><h1>Voo Encantado</h1></div>
      </div>
      <div class="stats" aria-label="Placar">
        <div class="stat">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m12 2.8 2.72 5.51 6.08.88-4.4 4.29 1.04 6.05L12 16.68l-5.44 2.85 1.04-6.05-4.4-4.29 6.08-.88L12 2.8Z" fill="#e1b94f"/></svg>
          <span><span class="stat-label">PONTOS</span><span class="stat-value" id="score">0</span></span>
        </div>
        <div class="stat">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 20.2s-8-4.63-8-10.19a4.18 4.18 0 0 1 7.38-2.7L12 8.1l.62-.79A4.18 4.18 0 0 1 20 10.01c0 5.56-8 10.19-8 10.19Z" fill="#e8a9a0"/></svg>
          <span><span class="stat-label">RECORDE</span><span class="stat-value" id="best">0</span></span>
        </div>
      </div>
    </header>

    <section class="game-shell" aria-label="Jogo Voo Encantado">
      <canvas id="game" aria-label="Unicórnio voando entre nuvens e estrelas"></canvas>
      <button class="sound-toggle" id="sound-toggle" type="button" aria-label="Desativar sons" aria-pressed="true" title="Desativar sons">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 10v4h4l5 4V6l-5 4H4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M16 9.5a4 4 0 0 1 0 5m2.5-7.5a7.5 7.5 0 0 1 0 10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <div class="launch-layer" id="launch-layer">
        <svg class="launch-sparkle" viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M20 2.5c1.8 9.1 4.4 11.7 13.5 13.5C24.4 17.8 21.8 20.4 20 29.5 18.2 20.4 15.6 17.8 6.5 16 15.6 14.2 18.2 11.6 20 2.5Z" fill="currentColor"/><path d="M32.4 25.7c.9 4.3 2.1 5.6 6.4 6.4-4.3.9-5.5 2.1-6.4 6.4-.8-4.3-2.1-5.5-6.4-6.4 4.3-.8 5.6-2.1 6.4-6.4Z" fill="#91cbd0"/></svg>
        <svg class="arrival-castle" viewBox="0 0 96 84" fill="none" aria-hidden="true">
          <path d="M24 75V34h48v41H24Z" fill="#fffefa" stroke="#b8d2d3" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M11 75V27h23v48H11ZM62 75V27h23v48H62Z" fill="#fffefa" stroke="#b8d2d3" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="m9 28 13-21 14 21M60 28 73 7l14 21M29 35 48 17l19 18" fill="#7096a6" stroke="#5e8191" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M48 17V5m0 0 12 4-12 4" stroke="#e8c261" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M39 75V58a9 9 0 0 1 18 0v17" fill="#8fcbd0" stroke="#75aeb6" stroke-width="2"/>
          <circle cx="52" cy="65" r="1.5" fill="#e8c261"/>
          <rect x="16" y="43" width="8" height="11" rx="3" fill="#ffe8a8" stroke="#e5d9b5"/>
          <rect x="72" y="43" width="8" height="11" rx="3" fill="#ffe8a8" stroke="#e5d9b5"/>
          <rect x="39" y="39" width="7" height="10" rx="3" fill="#ffe8a8" stroke="#e5d9b5"/>
          <rect x="50" y="39" width="7" height="10" rx="3" fill="#ffe8a8" stroke="#e5d9b5"/>
          <path d="M10 78h76" stroke="#94bdc4" stroke-width="3" stroke-linecap="round"/>
          <path d="m73 39 1.5 3.5 3.5 1.5-3.5 1.5-1.5 3.5-1.5-3.5-3.5-1.5 3.5-1.5 1.5-3.5Z" fill="#e8c261"/>
        </svg>
        <h2 id="launch-title">Vamos voar?</h2>
        <p id="launch-copy">Escape da tempestade e alcance o castelo!</p>
        <button class="launch-button" id="launch-button" type="button">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M7 4.8c0-.8.9-1.3 1.6-.9l7 5.1a1.2 1.2 0 0 1 0 2l-7 5.1c-.7.5-1.6 0-1.6-.9V4.8Z" fill="currentColor"/></svg>
          Começar a voar
        </button>
      </div>
    </section>

    <div class="journey">
      <div class="journey-heading"><span>CAMINHO ATÉ O CASTELO</span><span id="journey-count">0 / 8</span></div>
      <div class="journey-track" id="journey-track" role="progressbar" aria-label="Progresso até o território seguro" aria-valuemin="0" aria-valuemax="8" aria-valuenow="0"><span class="journey-fill" id="journey-fill"></span></div>
    </div>

    <div class="controls">
      <p class="hint">Pressione <kbd>ESPAÇO</kbd> ou <kbd>↑</kbd> para bater as asas</p>
      <button class="flight-button" id="flight-button" type="button" aria-label="Bater as asas">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Voar
      </button>
    </div>

    <p class="footnote">
      <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m8 1.5 1.48 4.2 4.33.07-3.46 2.6 1.27 4.14L8 10.03l-3.62 2.48 1.27-4.14-3.46-2.6 4.33-.07L8 1.5Z" fill="currentColor"/></svg>
      Feito de sonhos, nuvens e um pouquinho de magia
    </p>
  </main>

  <img id="unicorn-art" src="unicorn.svg" alt="" hidden>
  <script>
    (() => {
      const canvas = document.querySelector("#game");
      const context = canvas.getContext("2d");
      const launchLayer = document.querySelector("#launch-layer");
      const launchButton = document.querySelector("#launch-button");
      const launchTitle = document.querySelector("#launch-title");
      const launchCopy = document.querySelector("#launch-copy");
      const scoreLabel = document.querySelector("#score");
      const bestLabel = document.querySelector("#best");
      const journeyCount = document.querySelector("#journey-count");
      const journeyTrack = document.querySelector("#journey-track");
      const journeyFill = document.querySelector("#journey-fill");
      const unicornArt = document.querySelector("#unicorn-art");
      const flightButton = document.querySelector("#flight-button");
      const soundToggle = document.querySelector("#sound-toggle");
      const width = 1000;
      const height = 560;
      const floor = 503;
      const gatesToTerritory = 8;
      const bestKey = "voo-encantado-recorde";
      let best = Number(localStorage.getItem(bestKey)) || 0;
      let score = 0;
      let gatesPassed = 0;
      let state = "ready";
      let playerY = 264;
      let velocity = 0;
      let lastTime = 0;
      let elapsed = 0;
      let spawnTimer = 0;
      let clouds = [];
      let sparkles = [];
      let stars = [];
      let floatingClouds = [];
      let raf = 0;
      let soundContext;
      let rainSource;
      let rainGain;
      let soundEnabled = true;
      let lastNeighAt = -1;
      let wingSoundTimer = 0;
      let dialogueIndex = -1;
      let dialogueUntil = 0;
      let nextDialogueAt = Infinity;
      let lightningTimer = 0;
      let lightningFlash = 0;
      const dialogueLines = [
        { speaker: "mother", text: "Vamos, família!" },
        { speaker: "father", text: "Estou com você!" },
        { speaker: "grandmother", text: "Que chuva bonita!" },
        { speaker: "grandfather", text: "Rumo ao castelo!" },
        { speaker: "mother", text: "Olha uma estrela!" },
        { speaker: "father", text: "Juntos até o fim!" },
      ];

      bestLabel.textContent = String(best);

      const updateJourney = () => {
        const progress = gatesPassed / gatesToTerritory;
        journeyCount.textContent = `${gatesPassed} / ${gatesToTerritory}`;
        journeyTrack.setAttribute("aria-valuenow", String(gatesPassed));
        journeyFill.style.width = `${progress * 100}%`;
      };

      const seededClouds = [
        { x: 83, y: 107, scale: .66, speed: 13, alpha: .66 },
        { x: 420, y: 188, scale: .4, speed: 8, alpha: .44 },
        { x: 760, y: 95, scale: .83, speed: 17, alpha: .58 },
        { x: 1004, y: 231, scale: .48, speed: 11, alpha: .38 },
        { x: 244, y: 374, scale: .58, speed: 7, alpha: .48 },
        { x: 836, y: 414, scale: .72, speed: 12, alpha: .41 },
        { x: 182, y: 254, scale: .34, speed: 9, alpha: .38 },
        { x: 566, y: 316, scale: .5, speed: 11, alpha: .36 },
        { x: 1090, y: 347, scale: .4, speed: 10, alpha: .4 },
        { x: 28, y: 205, scale: .31, speed: 7, alpha: .42 },
        { x: 496, y: 75, scale: .38, speed: 8, alpha: .38 },
        { x: 922, y: 292, scale: .46, speed: 9, alpha: .34 },
      ];
      const rainDrops = Array.from({ length: 128 }, (_, index) => ({
        x: (index * 179 + 53) % width,
        y: (index * 97 + 31) % height,
        length: 10 + index % 8,
        speed: 230 + (index * 19) % 110,
        opacity: .22 + (index % 4) * .05,
      }));

      const resize = () => {
        const box = canvas.getBoundingClientRect();
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(box.width * ratio);
        canvas.height = Math.round(box.height * ratio);
        context.setTransform(canvas.width / width, 0, 0, canvas.height / height, 0, 0);
        render();
      };

      const cloud = (x, y, scale, color, alpha = 1) => {
        context.save();
        context.translate(x, y);
        context.scale(scale, scale);
        context.globalAlpha = alpha;
        context.fillStyle = color;
        context.beginPath();
        context.ellipse(0, 8, 54, 20, 0, 0, Math.PI * 2);
        context.arc(-30, 5, 17, Math.PI, Math.PI * 2);
        context.arc(-13, -9, 25, Math.PI, Math.PI * 2);
        context.arc(15, -17, 31, Math.PI, Math.PI * 2);
        context.arc(41, -4, 21, Math.PI, Math.PI * 2);
        context.closePath();
        context.fill();
        context.restore();
      };

      const star = (x, y, radius, rotation, color) => {
        context.save();
        context.translate(x, y);
        context.rotate(rotation);
        context.fillStyle = color;
        context.beginPath();
        for (let i = 0; i < 10; i++) {
          const angle = -Math.PI / 2 + i * Math.PI / 5;
          const size = i % 2 === 0 ? radius : radius * .24;
          const px = Math.cos(angle) * size;
          const py = Math.sin(angle) * size;
          if (i === 0) context.moveTo(px, py);
          else context.lineTo(px, py);
        }
        context.closePath();
        context.fill();
        context.restore();
      };

      const background = () => {
        const sky = context.createLinearGradient(0, 0, 0, height);
        sky.addColorStop(0, "#e8f8fa");
        sky.addColorStop(.52, "#f4fcfa");
        sky.addColorStop(1, "#fffaf0");
        context.fillStyle = sky;
        context.fillRect(0, 0, width, height);

        const sunGlow = context.createRadialGradient(805, 124, 12, 805, 124, 116);
        sunGlow.addColorStop(0, "rgba(255,255,255,.94)");
        sunGlow.addColorStop(.48, "rgba(255,250,225,.5)");
        sunGlow.addColorStop(1, "rgba(255,250,225,0)");
        context.fillStyle = sunGlow;
        context.fillRect(675, 0, 260, 250);

        context.globalAlpha = .76;
        context.fillStyle = "#fffefa";
        context.beginPath();
        context.moveTo(0, 427);
        context.bezierCurveTo(176, 374, 287, 430, 453, 409);
        context.bezierCurveTo(615, 388, 734, 415, 1000, 365);
        context.lineTo(1000, height);
        context.lineTo(0, height);
        context.closePath();
        context.fill();
        context.globalAlpha = 1;

        context.fillStyle = "rgba(255,255,255,.39)";
        for (let i = 0; i < 8; i++) {
          const x = ((i * 167 + elapsed * 13) % (width + 70)) - 30;
          const y = 47 + (i * 79) % 360;
          context.beginPath();
          context.arc(x, y, 1.5 + (i % 3), 0, Math.PI * 2);
          context.fill();
        }
      };

      const drawRain = () => {
        const stormIntensity = gatesPassed / gatesToTerritory;
        context.save();
        context.lineWidth = 1.7 + stormIntensity * .6;
        context.lineCap = "round";
        for (const drop of rainDrops) {
          const x = (drop.x - elapsed * (36 + stormIntensity * 60) + width) % width;
          const y = (drop.y + elapsed * (drop.speed + stormIntensity * 85)) % height;
          context.strokeStyle = `rgba(62,111,145,${Math.min(.78, drop.opacity + stormIntensity * .16)})`;
          context.beginPath();
          context.moveTo(x, y);
          context.lineTo(x - 4 - stormIntensity * 7, y + drop.length + stormIntensity * 5);
          context.stroke();
        }
        context.restore();
      };

      const drawStorm = () => {
        const intensity = gatesPassed / gatesToTerritory;
        if (intensity === 0) return;
        const stormX = -105 + intensity * 340;
        cloud(stormX, 39, 2.35, "#596f82", .27 + intensity * .35);
        cloud(stormX + 212, 22, 1.85, "#657c8e", .22 + intensity * .29);
        if (lightningFlash > 0) {
          context.save();
          context.globalAlpha = Math.min(1, lightningFlash * 6);
          context.strokeStyle = "#fff0b0";
          context.lineWidth = 5;
          context.lineJoin = "round";
          context.shadowColor = "#fff0b0";
          context.shadowBlur = 12;
          context.beginPath();
          context.moveTo(stormX + 100, 57);
          context.lineTo(stormX + 88, 82);
          context.lineTo(stormX + 101, 82);
          context.lineTo(stormX + 84, 111);
          context.stroke();
          context.restore();
        }
      };

      const drawSparkle = (item) => {
        const pulse = .65 + Math.sin(elapsed * 2 + item.phase) * .28;
        context.save();
        context.globalAlpha = pulse;

        const sampleRate = soundContext.sampleRate;
        const buffer = soundContext.createBuffer(1, Math.floor(sampleRate * duration), sampleRate);
        const samples = buffer.getChannelData(0);
        for (let sampleIndex = 0; sampleIndex < samples.length; sampleIndex++) {
          samples[sampleIndex] = Math.random() * 2 - 1;

        return buffer;

        if (!soundEnabled || rainSource) return;
        try {
          soundContext ||= new AudioContext();
          if (soundContext.state === "suspended") soundContext.resume();
          const source = soundContext.createBufferSource();
          const filter = soundContext.createBiquadFilter();
          const highPass = soundContext.createBiquadFilter();
          const gain = soundContext.createGain();
          source.buffer = makeNoiseBuffer(2);
          source.loop = true;
          highPass.type = "highpass";
          highPass.frequency.value = 280;
          filter.type = "lowpass";
          filter.frequency.value = 1500;
          gain.gain.setValueAtTime(.001, soundContext.currentTime);
          gain.gain.exponentialRampToValueAtTime(.075, soundContext.currentTime + .8);
          source.connect(highPass).connect(filter).connect(gain).connect(soundContext.destination);
          source.start();
          rainSource = source;
          rainGain = gain;
        } catch (_) { /* Audio is optional; flight works without it. */ }
      };

      const stopRain = () => {
        if (!soundContext || !rainSource) return;
        const now = soundContext.currentTime;
        const source = rainSource;
        rainSource = null;
        if (rainGain) {
          rainGain.gain.cancelScheduledValues(now);
          rainGain.gain.setTargetAtTime(.001, now, .08);
          source.stop(now + .35);
        } else {
          source.stop();
        }
        rainGain = null;
      };

      const playThunder = () => {
        if (!soundEnabled || !soundContext) return;

          const source = soundContext.createBufferSource();
          const filter = soundContext.createBiquadFilter();
          const gain = soundContext.createGain();
          source.buffer = makeNoiseBuffer(2.6);
          filter.type = "lowpass";
          filter.frequency.setValueAtTime(190, now);
          filter.frequency.exponentialRampToValueAtTime(65, now + 2.4);
          gain.gain.setValueAtTime(.001, now);
          gain.gain.setValueAtTime(.001, now + .12);
          gain.gain.linearRampToValueAtTime(.32, now + .3);
          gain.gain.exponentialRampToValueAtTime(.001, now + 2.5);
          source.connect(filter).connect(gain).connect(soundContext.destination);
          source.start(now + .12);
          source.stop(now + 2.6);

          const rumble = soundContext.createOscillator();
          const rumbleGain = soundContext.createGain();
          rumble.type = "sine";
          rumble.frequency.setValueAtTime(58, now + .12);
          rumble.frequency.exponentialRampToValueAtTime(34, now + 2.1);
          rumbleGain.gain.setValueAtTime(.001, now);
          rumbleGain.gain.linearRampToValueAtTime(.18, now + .35);
          rumbleGain.gain.exponentialRampToValueAtTime(.001, now + 2.2);
          rumble.connect(rumbleGain).connect(soundContext.destination);
          rumble.start(now + .12);
          rumble.stop(now + 2.3);
        } catch (_) { /* Audio is optional; flight works without it. */ }
      };

      const updateSoundToggle = () => {
        const label = soundEnabled ? "Desativar sons" : "Ativar sons";
        soundToggle.setAttribute("aria-label", label);
        soundToggle.setAttribute("title", label);
        soundToggle.setAttribute("aria-pressed", String(soundEnabled));
        soundToggle.innerHTML = soundEnabled
          ? '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 10v4h4l5 4V6l-5 4H4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M16 9.5a4 4 0 0 1 0 5m2.5-7.5a7.5 7.5 0 0 1 0 10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>'
          : '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 10v4h4l5 4V6l-5 4H4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="m17 9 5 6m0-6-5 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
      };

      const playChime = () => {
        if (!soundEnabled) return;
        try {
          soundContext ||= new AudioContext();
          if (soundContext.state === "suspended") soundContext.resume();
          const oscillator = soundContext.createOscillator();
          const gain = soundContext.createGain();
          oscillator.type = "sine";
          oscillator.frequency.setValueAtTime(880, soundContext.currentTime);
          oscillator.frequency.exponentialRampToValueAtTime(1318, soundContext.currentTime + .1);
          gain.gain.setValueAtTime(.12, soundContext.currentTime);
          gain.gain.exponentialRampToValueAtTime(.001, soundContext.currentTime + .2);
          oscillator.connect(gain).connect(soundContext.destination);
          oscillator.start();
          oscillator.stop(soundContext.currentTime + .21);
        } catch (_) { /* Audio is optional; flight works without it. */ }
      };

      const playNeigh = () => {
        if (!soundEnabled) return;
        try {
          soundContext ||= new AudioContext();
          if (soundContext.state === "suspended") soundContext.resume();
          const now = soundContext.currentTime;
          if (now - lastNeighAt < .35) return;
          lastNeighAt = now;
          const oscillator = soundContext.createOscillator();
          const filter = soundContext.createBiquadFilter();
          const gain = soundContext.createGain();
          oscillator.type = "triangle";
          oscillator.frequency.setValueAtTime(470, now);
          oscillator.frequency.exponentialRampToValueAtTime(860, now + .09);
          oscillator.frequency.exponentialRampToValueAtTime(430, now + .34);
          filter.type = "lowpass";
          filter.frequency.value = 1500;
          gain.gain.setValueAtTime(.001, now);
          gain.gain.linearRampToValueAtTime(.1, now + .025);
          gain.gain.exponentialRampToValueAtTime(.001, now + .35);
          oscillator.connect(filter).connect(gain).connect(soundContext.destination);
          oscillator.start(now);
          oscillator.stop(now + .36);
        } catch (_) { /* Audio is optional; flight works without it. */ }
      };

      const playWingFlap = () => {
        if (!soundEnabled || !soundContext) return;
        try {
          const now = soundContext.currentTime;
          const source = soundContext.createBufferSource();
          const filter = soundContext.createBiquadFilter();
          const gain = soundContext.createGain();
          source.buffer = makeNoiseBuffer(.42);
          filter.type = "lowpass";
          filter.frequency.setValueAtTime(900, now);
          filter.frequency.exponentialRampToValueAtTime(260, now + .38);
          gain.gain.setValueAtTime(.001, now);
          gain.gain.linearRampToValueAtTime(.09, now + .06);
          gain.gain.exponentialRampToValueAtTime(.001, now + .4);
          source.connect(filter).connect(gain).connect(soundContext.destination);
          source.start(now);
          source.stop(now + .42);

          const thump = soundContext.createOscillator();
          const thumpGain = soundContext.createGain();
          thump.type = "sine";
          thump.frequency.setValueAtTime(78, now);
          thump.frequency.exponentialRampToValueAtTime(43, now + .24);
          thumpGain.gain.setValueAtTime(.055, now);
          thumpGain.gain.exponentialRampToValueAtTime(.001, now + .28);
          thump.connect(thumpGain).connect(soundContext.destination);
          thump.start(now);
          thump.stop(now + .3);

          const airTone = soundContext.createOscillator();
          const airFilter = soundContext.createBiquadFilter();
          const airGain = soundContext.createGain();
          airTone.type = "triangle";
          airTone.frequency.setValueAtTime(190, now);
          airTone.frequency.exponentialRampToValueAtTime(360, now + .12);
          airTone.frequency.exponentialRampToValueAtTime(150, now + .36);
          airFilter.type = "lowpass";
          airFilter.frequency.value = 760;
          airGain.gain.setValueAtTime(.001, now);
          airGain.gain.linearRampToValueAtTime(.025, now + .07);
          airGain.gain.exponentialRampToValueAtTime(.001, now + .37);
          airTone.connect(airFilter).connect(airGain).connect(soundContext.destination);
          airTone.start(now);
          airTone.stop(now + .39);
        } catch (_) { /* Audio is optional; flight works without it. */ }
      };

      const start = () => {
        if (state === "running") return;
        cancelAnimationFrame(raf);
        state = "running";
        score = 0;
        gatesPassed = 0;
        updateJourney();
        lightningTimer = 0;
        lightningFlash = 0;
        wingSoundTimer = 0;
        elapsed = 0;
        dialogueIndex = 0;
        dialogueUntil = 2.4;
        nextDialogueAt = 5.5;
        spawnTimer = .45;
        playerY = 264;
        velocity = -150;
        clouds = [];
        stars = [];
        scoreLabel.textContent = "0";
        launchLayer.hidden = true;
        startRain();
        lastTime = performance.now();
        raf = requestAnimationFrame(frame);
      };

      const flap = () => {
        if (state !== "running") {
          if (state === "ready" || state === "over") start();
          return;
        }
        velocity = -410;
        playNeigh();
      };

      const addCloud = () => {
        const gapSize = 191;
        const gapTop = 106 + Math.random() * 176;
        const gapBottom = gapTop + gapSize;
        const x = width + 75;
        clouds.push({ x, gapTop, gapBottom, passed: false });
        stars.push({ x, y: (gapTop + gapBottom) / 2, collected: false });
      };

      const circleRect = (cx, cy, radius, x, y, w, h) => {
        const nearestX = Math.max(x, Math.min(cx, x + w));
        const nearestY = Math.max(y, Math.min(cy, y + h));
        return (cx - nearestX) ** 2 + (cy - nearestY) ** 2 < radius ** 2;
      };

      const addPoint = () => {
        score++;
        scoreLabel.textContent = String(score);
      };

      const finish = (reachedTerritory = false) => {
        state = "over";
        stopRain();
        if (score > best) {
          best = score;
          localStorage.setItem(bestKey, String(best));
          bestLabel.textContent = String(best);
        }
        launchTitle.textContent = reachedTerritory ? "Castelo alcançado!" : "Até a próxima!";
        launchCopy.textContent = reachedTerritory
          ? `Você chegou ao castelo com ${score} ${score === 1 ? "ponto" : "pontos"}.`
          : `Você fez ${score} ${score === 1 ? "ponto" : "pontos"}.`;
        launchLayer.classList.toggle("arrived", reachedTerritory);
        launchButton.innerHTML = '<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 3.8a6.2 6.2 0 1 1-5.84 4.12M4.16 3.8v4.4h4.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Voar novamente';
        launchLayer.hidden = false;
        render();
      };

      const frame = (now) => {
        if (state !== "running") return;
        const delta = Math.min((now - lastTime) / 1000, .035);
        lastTime = now;
        elapsed += delta;
        if (elapsed >= nextDialogueAt) {
          dialogueIndex = (dialogueIndex + 1) % dialogueLines.length;
          dialogueUntil = elapsed + 2.3;
          nextDialogueAt = elapsed + 5.5 + Math.random() * 1.8;
        }
        wingSoundTimer += delta;
        if (wingSoundTimer >= .58) {
          wingSoundTimer -= .58;
          playWingFlap();
        }
        velocity += 940 * delta;
        playerY += velocity * delta;
        spawnTimer -= delta;

        if (gatesPassed >= 2) {
          lightningTimer += delta;
          lightningFlash = Math.max(0, lightningFlash - delta);
          if (lightningTimer > 2.8) {
            lightningTimer = 0;
            lightningFlash = .24;
            playThunder();
          }
        }

        if (spawnTimer <= 0) {
          addCloud();
          spawnTimer = 2.25;
        }

        const speed = 226;
        for (const item of floatingClouds) {
          item.x -= item.speed * delta;
          if (item.x < -100) item.x = width + 100;
        }
        for (const item of clouds) {
          item.x -= speed * delta;
          if (!item.passed && item.x < 123) {
            item.passed = true;
            gatesPassed++;
            updateJourney();
            addPoint();
            if (gatesPassed >= gatesToTerritory) {
              finish(true);
              return;
            }
          }
        }
        clouds = clouds.filter((item) => item.x > -100);

        for (const item of stars) item.x -= speed * delta;
        stars = stars.filter((item) => item.x > -30);
        for (let index = 0; index < clouds.length; index++) {
          const item = clouds[index];
          if (item.x < 229 && item.x > 144) {
            const hitTop = circleRect(186, playerY, 25, item.x - 38, 0, 76, item.gapTop - 27);
            const hitBottom = circleRect(186, playerY, 25, item.x - 38, item.gapBottom + 27, 76, floor - item.gapBottom);
            if (hitTop || hitBottom) {
              finish();
              return;
            }
          }
        }

        for (const item of stars) {
          if (!item.collected && Math.hypot(186 - item.x, playerY - item.y) < 34) {
            item.collected = true;
            addPoint();
            playChime();
          }
        }
        stars = stars.filter((item) => !item.collected);

        if (playerY > floor - 20 || playerY < 20) {
          finish();
          return;
        }

        render();
        raf = requestAnimationFrame(frame);
      };

      floatingClouds = seededClouds.map((item) => ({ ...item }));
      const animateIdle = (now) => {
        if (state !== "ready") return;
        elapsed = now / 1000;
        for (const item of floatingClouds) {
          item.x -= item.speed / 60;
          if (item.x < -100) item.x = width + 100;
        }
        playerY = 264 + Math.sin(elapsed * 1.5) * 9;
        render();
        requestAnimationFrame(animateIdle);
      };

      launchButton.addEventListener("click", start);
      soundToggle.addEventListener("click", () => {
        soundEnabled = !soundEnabled;
        updateSoundToggle();
        if (soundEnabled && state === "running") startRain();
        else stopRain();
      });
      flightButton.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        flap();
      });
      window.addEventListener("keydown", (event) => {
        if ((event.code === "Space" || event.code === "ArrowUp") && !event.repeat) {
          event.preventDefault();
          flap();
        }
      });
      window.addEventListener("resize", resize);
      unicornArt.addEventListener("load", render);
      resize();
      requestAnimationFrame(animateIdle);
    })();
  </script>
</body>
</html>
